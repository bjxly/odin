<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===== SEO 核心 ===== -->
    <title>%VITE_APP_TITLE%</title>
    <meta name="description" content="SmartJOne —— 企业级 Java 快速开发底座，一套底座，智启万物" />
    <meta name="keywords" content="SmartJOne,企业级开发框架,多租户,快速开发,Spring Boot,Vue3" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://smartj.com" />

    <!-- ===== Open Graph（微信 / 飞书 / Facebook 等分享卡片）===== -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%VITE_APP_TITLE%" />
    <meta property="og:description" content="SmartJOne —— 企业级 Java 快速开发底座，一套底座，智启万物" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://smartj.com" />
    <meta property="og:site_name" content="SmartJOne" />
    <meta property="og:locale" content="zh_CN" />

    <!-- ===== Twitter Card ===== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%VITE_APP_TITLE%" />
    <meta name="twitter:description" content="SmartJOne —— 企业级 Java 快速开发底座，一套底座，智启万物" />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- ===== 结构化数据（JSON-LD）===== -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "SmartJOne",
      "description": "SmartJOne —— 企业级 Java 快速开发底座",
      "url": "https://smartj.com",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web"
    }
    </script>

    <!-- ===== 浏览器图标 ===== -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

# ====== 部署形态（微服务模式必须为 cloud）======
SMARTJ_DEPLOY_MODE=boot
SMARTJ_DATASOURCE_DIALECT=mysql

# ====== 数据库（所有业务服务共享）======
DB_HOST=mysql
DB_PORT=13306
DB_NAME=smartj
DB_USERNAME=root
DB_PASSWORD=odin123456
DB_URL=jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true


# ====== Redis（所有业务服务共享）======
REDIS_HOST=localhost
REDIS_PORT=16379
REDIS_PASSWORD=odin123456

# ====== 缓存 ======
SMARTJ_CACHE_TYPE=redis

# ====== OSS（仅 smartj-cloud-oss 使用）======
OSS_TYPE=local
OSS_ENDPOINT=http://localhost:9000
OSS_EXTERNAL_ENDPOINT=http://localhost:9000
OSS_REGION=us-east-1
OSS_ACCESS_KEY=minioadmin
OSS_SECRET_KEY=minioadmin
OSS_BUCKET=smartj

# ====== OAuth2 / JWT ======
OAUTH2_ISSUER=http://localhost:9000/api/auth
JWT_KEY_PATH=config/smartj-jwt.key

# ====== 国密密钥 ======

services:
  # ============================================================
  # MySQL 8.4
  # ============================================================
  mysql:
    image: mysql:8.4.7
    container_name: odin-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-smartj}
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-13306}:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./init-db/mysql:/docker-entrypoint-initdb.d:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --mysql-native-password=ON
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: odin-pgsql
    pull_policy: missing
    environment:
      POSTGRES_DB: ${PG_DB:-demo}
      POSTGRES_USER: ${PG_USERNAME:-odin}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-Cqmygnsdss@123}
      # 演示库使用 UTF8 编码（initdb 默认跟随 locale，Windows Docker 下可能为 SQL_ASCII）
      POSTGRES_INITDB_ARGS: --encoding=UTF8
      TZ: Asia/Shanghai
    ports:
      - "${PG_PORT:-15432}:5432"
    volumes:
      - ./data/pg:/var/lib/postgresql/data
      - ./init-db/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USERNAME:-odin} -d ${PG_DB:-demo}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ============================================================
  # Redis 8.4 (odin 运行时缓存)
  # ============================================================
  redis:
    image: redis:8.4.0
    container_name: odin-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

